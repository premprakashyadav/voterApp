name: Keep Render Backend Warm

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Create logs folder
        run: mkdir -p ping-logs

      - name: Ping Render API with retries and log
        run: |
          URL="https://corporatorelection.onrender.com/api/health"
          MAX_RETRIES=3
          RETRY_COUNT=0
          STATUS=0
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
          LOG_FILE="ping-logs/ping-$(date +%Y%m%d-%H%M%S).log"

          echo "Ping started at $TIMESTAMP" >> $LOG_FILE

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ $TIMESTAMP Backend is healthy (HTTP $STATUS)" >> $LOG_FILE
              break
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "⚠️ $TIMESTAMP Ping failed (HTTP $STATUS). Retry $RETRY_COUNT/$MAX_RETRIES..." >> $LOG_FILE
              sleep 10
            fi
          done

          if [ "$STATUS" -ne 200 ]; then
            echo "❌ $TIMESTAMP Backend is not responding after $MAX_RETRIES retries." >> $LOG_FILE
            exit 1
          fi

      - name: Upload ping log artifact
        uses: actions/upload-artifact@v3
        with:
          name: ping-log
          path: ping-logs/
