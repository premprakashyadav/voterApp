name: Keep Render Backend Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Create logs folder
        run: mkdir -p ping-logs

      - name: Ping Render API with retries and log
        run: |
          URL=https://corporatorelection.onrender.com/api/collections/corporatorElectionData/records?page=1&perPage=500&skipTotal=1&filter=((name%20~%20%22%E0%A4%AD%E0%A4%BE%E0%A4%B2%E0%A5%87%E0%A4%95%E0%A4%B0%22)%20%26%26%20familyqty%20%3E%201)%20%7C%7C%20((name%20~%20%22%E0%A4%AD%E0%A4%BE%E0%A4%B2%E0%A5%87%E0%A4%95%E0%A4%B0%22)%20%26%26%20familyqty%20%3D%20%271%27)%20%7C%7C%20(name%20~%20%22%E0%A4%AD%E0%A4%BE%E0%A4%B2%E0%A5%87%E0%A4%95%E0%A4%B0%22)&fields=familycode"
          MAX_RETRIES=3
          RETRY_COUNT=0
          STATUS=0
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
          LOG_FILE="ping-logs/ping-$(date +%Y%m%d-%H%M%S).log"

          echo "Ping started at $TIMESTAMP" >> $LOG_FILE

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ $TIMESTAMP Backend is healthy (HTTP $STATUS)" >> $LOG_FILE
              break
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "⚠️ $TIMESTAMP Ping failed (HTTP $STATUS). Retry $RETRY_COUNT/$MAX_RETRIES..." >> $LOG_FILE
              sleep 10
            fi
          done

          if [ "$STATUS" -ne 200 ]; then
            echo "❌ $TIMESTAMP Backend is not responding after $MAX_RETRIES retries." >> $LOG_FILE
            exit 1
          fi

      - name: Upload ping log artifact
        uses: actions/upload-artifact@v4
        with:
          name: ping-log
          path: ping-logs/
